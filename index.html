<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>強心升壓藥物劑量換算</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#667085;--ac:#0f766e;--acbg:#e6f4f2;--bd:#e1e4ea;--warn:#b45309}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--card:#1b212b;--tx:#e8ebf0;--mut:#9aa4b2;--ac:#4fd1c5;--acbg:#16322f;--bd:#2c3441;--warn:#fbbf24}}
:root[data-theme="dark"]{--bg:#12161d;--card:#1b212b;--tx:#e8ebf0;--mut:#9aa4b2;--ac:#4fd1c5;--acbg:#16322f;--bd:#2c3441;--warn:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top h1{font-size:16px;margin:0;flex:1 1 100%}
.top label{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:76px}
#bw{width:100px;font-size:20px;font-weight:700;border-color:var(--ac)}
main{max-width:720px;margin:0 auto;padding:12px 12px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0}
.card h2 small{color:var(--mut);font-weight:400;font-size:13px;margin-left:6px}
.prep{font-size:13px;color:var(--mut);margin:2px 0 8px}
.v{border-top:1px dashed var(--bd);padding-top:8px;margin-top:8px}
.v:first-of-type{border-top:0;margin-top:0;padding-top:0}
.conc{display:inline-block;background:var(--acbg);color:var(--ac);border-radius:6px;padding:1px 8px;font-size:13px;font-weight:600}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.big div{background:var(--acbg);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--mut)}
.big b{display:block;font-size:19px;color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
td,th{padding:5px 2px;text-align:left;border-bottom:1px solid var(--bd)}
th{color:var(--mut);font-weight:500;font-size:12px}
td:not(:first-child),th:not(:first-child){text-align:right}
.calc{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--mut)}
.calc input{width:80px;padding:5px 8px}
.calc output{color:var(--ac);font-weight:700}
.note{font-size:12px;color:var(--warn);margin:14px 2px}
</style>
</head>
<body>
<div class="top">
<h1>強心升壓藥物劑量換算</h1>
<label>年齡 <input id="age" type="number" inputmode="numeric" placeholder="選填"></label>
<label>身高 <input id="ht" type="number" inputmode="decimal" placeholder="cm"></label>
<label>體重 <input id="bw" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0"> Kg</label>
</div>
<main id="app"></main>
<script>
const D=[
{n:'Gipamine',s:'Dopamine',v:[{p:'藥袋 600 mg / 200 ml',c:3000}],r:[['D',1,3],['β',3,10],['α',10,20]]},
{n:'Dobutamine',s:'Dobutrex',v:[{p:'750 mg (3Amp) + D5W 190 ml，Total 250 ml（抽 60 ml）',c:3000}],r:[['',2,20]]},
{n:'Millisrol (NTG)',s:'專用 set',v:[{p:'30 mg (6Amp) + N/S 190 ml，Total 250 ml（抽 60 ml）',c:120},{p:'原汁 5 mg (1Amp) / 10 ml',c:500}],r:[['',0.2,10],['',5,300,1]]},
{n:'Levophed',s:'Norepinephrine',v:[{p:'4 mg (1Amp) + D5W 246 ml，Total 250 ml（抽 4 ml）',c:16},{p:'16 mg (4Amp) + D5W 234 ml，Total 250 ml（抽 16 ml）',c:64}],r:[['',0.02,1]]},
{n:'Bosmin',s:'Epinephrine',v:[{p:'4 mg (4Amp) + N/S 246 ml，Total 250 ml（抽 4 ml）',c:16}],r:[['',1,10,1],['',0.01,0.16]]},
{n:'Isurpel',s:'Isoproterenol',v:[{p:'600 ug (3Amp) + D5W 47 ml，Total 50 ml（抽 3 ml）',c:12},{p:'200 ug (1Amp) + D5W 19 ml，Total 20 ml（抽 1 ml）',c:10}],r:[['',0.02,0.5]]},
{n:'Primacor',s:'Milrinone',v:[{p:'10 mg (1Amp) + N/S 90 ml，Total 100 ml（抽 10 ml）',c:100}],r:[['',0.375,0.75]]}
];
const H=[['CBP','ACT>400"',300],['Beating Heart','ACT>300"',150],['PTA','ACT 250~300"',100]];
const f=x=>isFinite(x)&&x>0?String(parseFloat(x.toFixed(4))):'—';
const bw=()=>parseFloat(document.getElementById('bw').value)||0;
let h='';const upd=[];
D.forEach((d,i)=>{
h+=`<div class="card"><h2>${i+1}. ${d.n}<small>${d.s}</small></h2>`;
d.v.forEach((v,j)=>{
const k=i+'_'+j;
h+=`<div class="v"><div class="prep">${v.p}</div><span class="conc">${v.c} ug/ml</span>
<div class="big"><div>1 ml/hr =<b id="a${k}">—</b>ug/kg/min</div><div>1 ug/kg/min =<b id="b${k}">—</b>ml/hr</div></div>
<table><tr><th>參考劑量</th><th>ml/hr</th></tr>`;
d.r.forEach((r,m)=>{h+=`<tr><td>${r[0]?r[0]+'：':''}${r[1]}~${r[2]} ${r[3]?'ug/min':'ug/kg/min'}</td><td id="r${k}_${m}">—</td></tr>`;});
h+=`</table><div class="calc">劑量 <input type="number" inputmode="decimal" id="d${k}" placeholder="0"> ug/kg/min → <output id="o${k}">—</output> ml/hr
　｜　速率 <input type="number" inputmode="decimal" id="s${k}" placeholder="0"> ml/hr → <output id="p${k}">—</output> ug/kg/min</div></div>`;
upd.push([k,v.c,d.r]);
});
h+='</div>';
});
h+=`<div class="card"><h2>8. Amiodarone</h2><div class="prep">900 mg (6Amp) + D5W 232 ml，Total 250 ml（抽 18 ml）</div><span class="conc">3.6 mg/ml</span>
<table><tr><th>階段</th><th>劑量</th><th>ml/hr</th></tr>
<tr><td>前 6 小時</td><td>1 mg/min</td><td>${f(60/3.6)}</td></tr>
<tr><td>之後 18 小時</td><td>0.5 mg/min</td><td>${f(30/3.6)}</td></tr></table></div>`;
h+=`<div class="card"><h2>9. Heparin<small>5000 Units / ml</small></h2><table><tr><th>術式</th><th>Unit</th><th>ml (÷5000)</th></tr>`;
H.forEach((x,i)=>{h+=`<tr><td>${x[0]}<br><small style="color:var(--mut)">${x[1]}　BW×${x[2]}</small></td><td id="hu${i}">—</td><td id="hm${i}">—</td></tr>`;});
h+=`</table></div><div class="card"><h2>10. Protamine<small>10 mg/ml</small></h2><div class="prep">每 10 mg/ml 可拮抗 Heparin 1000~1400 Unit；Heparin 總 Unit ÷ 1000 或 1400 = ml</div><table><tr><th>術式</th><th>拮抗 1000 U</th><th>拮抗 1400 U</th></tr>`;
H.forEach((x,i)=>{h+=`<tr><td>${x[0]}</td><td id="p0${i}">—</td><td id="p1${i}">—</td></tr>`;});
h+=`</table></div><div class="note">⚠ 數值四捨五入至小數點第四位。本頁為輔助計算工具，臨床使用前請依院內規範與醫囑雙人核對。</div>`;
document.getElementById('app').innerHTML=h;
function calc(){
const w=bw();
upd.forEach(([k,c,r])=>{
const e=id=>document.getElementById(id+k);
e('a').textContent=w?f(c/w/60):'—';
e('b').textContent=w?f(w*60/c):'—';
r.forEach((x,m)=>{
const t=document.getElementById('r'+k+'_'+m);
t.textContent=(x[3]||w)?f((x[3]?1:w)*x[1]*60/c)+' ~ '+f((x[3]?1:w)*x[2]*60/c):'—';
});
const d=parseFloat(e('d').value),s=parseFloat(e('s').value);
e('o').textContent=w&&d?f(d*w*60/c):'—';
e('p').textContent=w&&s?f(s*c/w/60):'—';
});
H.forEach((x,i)=>{
const u=w*x[2];
document.getElementById('hu'+i).textContent=w?f(u)+' U':'—';
document.getElementById('hm'+i).textContent=w?f(u/5000)+' ml':'—';
document.getElementById('p0'+i).textContent=w?f(u/1000)+' ml':'—';
document.getElementById('p1'+i).textContent=w?f(u/1400)+' ml':'—';
});
}
document.addEventListener('input',calc);calc();
</script>
</body>
</html>
